# Build, gate, and deploy to Cloudflare Pages.
#
# Pushes to main go to production. Pull requests get their own preview
# deployment on a branch alias, so a change can be looked at on the real runtime
# before it is the live site.
#
# The build step runs scripts/check-html.mjs, which fails on defects that only
# exist in the rendered output — a word fused to a link, an HTML entity printed
# instead of rendered, an absolute URL pointing at a domain we do not serve. A
# check nobody can block a deploy with is a dashboard, so this one blocks.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy per ref at a time. Two pushes in quick succession should not race
# each other to decide which one ends up live.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PROJECT: amartya-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: the lockfile is the input, and a deploy that
      # silently resolves a different dependency tree than the one tested is a
      # deploy nobody can reproduce.
      - run: npm ci

      # The spending guards on the ask endpoint. Runs before the build because
      # a deploy that removes the rate limiter is worse than one that fails.
      - run: npm test

      # Builds and runs the HTML gate. Fails the job on either.
      - run: npm run build

      # A pull request from a fork cannot see repository secrets, so there is
      # nothing to deploy with. Say so rather than failing on a missing token.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials on this run — built and gated only."
          fi

      # Idempotent by tolerance: creating a project that already exists is an
      # error we ignore, which lets a fresh account bootstrap on the first run
      # instead of needing a manual step in the dashboard first.
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create "$PROJECT" \
            --production-branch=main 2>/dev/null \
            || echo "project already exists"

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A push to main is production. Anything else deploys to a preview
          # alias named after its branch.
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          npx wrangler pages deploy \
            --branch="$BRANCH" \
            --commit-dirty=true
